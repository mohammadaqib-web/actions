name: API Calls

on: push

jobs: 
 build:
  runs-on: ubuntu-latest

  steps: 
    -name: Clone Respository
    uses: actions/checkout@v4

    -name: Install Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

    -name: Install Dependencies
    run: npm Install

    -name: Build App
    run: npm run build